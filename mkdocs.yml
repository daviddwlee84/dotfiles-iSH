site_name: dotfiles-iSH
site_url: https://daviddwlee84.github.io/dotfiles-iSH/
repo_url: https://github.com/daviddwlee84/dotfiles-iSH
theme:
  name: material
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Setup: 安裝與管理
            Shell and Starship: Shell 與 Starship
            Tools: 工具與支援
            Verification: 驗證與維護
            iOS terminals: iOS 終端機
            System upgrades: 系統升級
            SSH server: SSH 伺服器
            Finder files: Finder 檔案共享
            Herdr on iSH: iSH 上的 Herdr
            Experiments: 實驗與驗證
nav:
  - Home: index.md
  - Setup: setup.md
  - Tools: tools.md
  - Shell and Starship: shell.md
  - Verification: verification.md
  - iOS terminals: ios-terminals.md
  - System upgrades: system-upgrade.md
  - SSH server: ssh-server.md
  - Finder files: finder-files.md
  - Herdr on iSH: herdr-ish.md
  - Experiments: experiments.md
