name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - run: sh scripts/ci-tools.sh chezmoi
      - run: sh scripts/lint.sh
      - run: bats tests
      - run: uv run --no-project --with 'mkdocs<2' --with mkdocs-material --with mkdocs-static-i18n mkdocs build --strict
      - run: uvx pre-commit run detect-private-key --all-files
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  musl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Locked binaries in a disposable native musl userspace
        run: |
          docker run --rm -e GITHUB_ACTIONS=true -v "$PWD:/source:ro" -w /source alpine:3.22 \
            sh -ec 'apk add --no-cache curl coreutils ca-certificates libstdc++ && sh scripts/ci-tools.sh smoke'
